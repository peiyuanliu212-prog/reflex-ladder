<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>反应天梯 · Reflex Ladder</title>
<style>
:root{
  --bg:#0b0e14; --panel:#131926; --panel2:#0f1420;
  --cyan:#22d3ee; --magenta:#f472b6; --gold:#fbbf24;
  --text:#e5eef7; --dim:#8b9bb4; --red:#ef4444; --green:#22ff9a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px}
.screen{display:none;flex-direction:column;gap:14px;flex:1}
.screen.active{display:flex}

/* 开始页 */
.home-hero{text-align:center;padding:18px 0 4px}
.hero-ms{font-size:15px;color:var(--dim);letter-spacing:2px}
.hero-ms span{font-size:64px;font-weight:800;color:var(--cyan);text-shadow:0 0 24px rgba(34,211,238,.55);letter-spacing:0}
.hero-ms small{margin-left:6px}
.game-title{font-size:44px;font-weight:900;letter-spacing:4px;margin-top:2px}
.game-title .neon{color:var(--magenta);text-shadow:0 0 22px rgba(244,114,182,.6)}
.slogan{color:var(--dim);margin-top:8px;font-size:15px}
.ladder-steps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.ladder-steps span{font-size:12px;color:var(--dim);border:1px solid #26314a;border-radius:999px;padding:3px 10px;background:var(--panel2)}
.ladder-steps span.top{color:#0b0e14;background:var(--gold);border-color:var(--gold);font-weight:700}
.home-modes{display:flex;flex-direction:column;gap:10px}
.mode-card{background:var(--panel);border:1px solid #1e2a44;border-radius:14px;padding:14px 16px}
.mode-name{font-size:18px;font-weight:700}
.mode-desc{color:var(--dim);font-size:13px;margin-top:4px;line-height:1.5}
.btn-primary{background:linear-gradient(90deg,var(--cyan),#0ea5c6);color:#04121a;border:none;border-radius:14px;padding:16px;font-size:19px;font-weight:800;letter-spacing:2px;cursor:pointer;min-height:56px}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid #26314a;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;min-height:48px}
.home-best{font-size:14px;color:var(--gold);text-align:center;min-height:20px;line-height:1.6}
.device-line{text-align:center;color:var(--dim);font-size:13px}
.foot-note{text-align:center;color:#5b6b84;font-size:12px;line-height:1.6}

/* 对局 */
.hud{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);padding:2px 2px}
.arena{position:relative;flex:1;min-height:380px;border-radius:18px;border:1px solid #1e2a44;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.flash-wait{background:#3d1420;border-color:#5b1f30}
.flash-go{background:#0d3d28;border-color:#166a45}
.flash-idle{background:var(--panel2)}
.arena-big{font-size:34px;font-weight:800;text-align:center;padding:0 16px}
.arena-sub{color:var(--dim);font-size:14px;text-align:center;padding:0 20px;line-height:1.6}
.arena-pop{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:40px;font-weight:900;color:var(--cyan);text-shadow:0 0 18px rgba(34,211,238,.7);pointer-events:none;opacity:0;transition:opacity .12s}
.arena-pop.show{opacity:1}
.center-tip{position:absolute;top:14px;left:0;right:0}
.target{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--magenta) 0 26%,#fff 27% 45%,var(--cyan) 46% 68%,rgba(34,211,238,.25) 69% 100%);box-shadow:0 0 20px rgba(244,114,182,.55);cursor:pointer}
.target-core{position:absolute;inset:38%;border-radius:50%;background:#fff}

/* 结算 */
.result-title{text-align:center;font-size:24px;letter-spacing:2px}
.result-combo{text-align:center}
.result-combo span{font-size:58px;font-weight:900;color:var(--gold);text-shadow:0 0 22px rgba(251,191,36,.45)}
.result-combo small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.result-cards{display:flex;flex-direction:column;gap:10px}
.rcard{background:var(--panel);border:1px solid #1e2a44;border-radius:14px;padding:14px 16px}
.rcard-name{font-size:16px;font-weight:700}
.rcard-big span{font-size:38px;font-weight:900;color:var(--cyan)}
.rcard-big small{color:var(--dim);font-size:13px;margin-left:6px}
.rcard-detail{color:var(--dim);font-size:13px;line-height:1.7;margin-top:4px;word-break:break-all}
.diagnosis{background:#12233a;border:1px solid #1d3a5f;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.device-note{color:#5b6b84;font-size:12px;text-align:center;line-height:1.6}
.result-btns{display:flex;flex-direction:column;gap:10px}
@media (max-width:380px){.game-title{font-size:38px}.arena{min-height:340px}}

</style>
</head>
<body>
<div id="app">

  <!-- 开始页 -->
  <section id="screen-home" class="screen active">
    <div class="home-hero">
      <div class="hero-ms"><span id="hero-ms-num">167</span><small>ms · 示例</small></div>
      <h1 class="game-title">反应<span class="neon">天梯</span></h1>
      <p class="slogan">200ms 是人类，150ms 是天才，你呢？</p>
      <div class="ladder-steps" aria-hidden="true">
        <span>青铜</span><span>白银</span><span>黄金</span><span>铂金</span><span>钻石</span><span>大师</span><span>王者</span><span class="top">封神</span>
      </div>
    </div>
    <div class="home-modes">
      <div class="mode-card">
        <div class="mode-name">⚡ 闪击</div>
        <div class="mode-desc">红变绿的瞬间点下去，测本设备反应时间 · 5 次取中位数</div>
      </div>
      <div class="mode-card">
        <div class="mode-name">🎯 狙击</div>
        <div class="mode-desc">靶子随机闪现，点得越快越准分越高 · 10 个靶</div>
      </div>
    </div>
    <button id="btn-start" class="btn-primary">开始测试</button>
    <div class="home-best" id="home-best"></div>
    <div class="device-line" id="device-line">设备档检测中…</div>
    <p class="foot-note">成绩为本设备测得值，含屏幕与触控延迟；同设备对比最准。</p>
  </section>

  <!-- 闪击 -->
  <section id="screen-flash" class="screen">
    <div class="hud"><span id="flash-progress">闪击 0/5</span><span id="flash-fouls"></span></div>
    <div id="flash-arena" class="arena flash-wait">
      <div id="flash-text" class="arena-big">点击开始</div>
      <div id="flash-sub" class="arena-sub">变绿后立刻点任意位置，抢跑作废</div>
      <div id="flash-last" class="arena-pop"></div>
    </div>
    <button id="btn-flash-quit" class="btn-ghost">放弃本局</button>
  </section>

  <!-- 狙击 -->
  <section id="screen-sniper" class="screen">
    <div class="hud"><span id="sniper-progress">狙击 0/10</span><span id="sniper-hits"></span></div>
    <div id="sniper-arena" class="arena">
      <div id="sniper-tip" class="arena-sub center-tip">靶子即将出现，点中它！</div>
      <div id="sniper-target" class="target" hidden><div class="target-core"></div></div>
      <div id="sniper-pop" class="arena-pop"></div>
    </div>
    <button id="btn-sniper-quit" class="btn-ghost">放弃本局</button>
  </section>

  <!-- 结算 -->
  <section id="screen-result" class="screen">
    <h2 class="result-title">双维成绩卡</h2>
    <div class="result-combo"><span id="combo-score">0</span><small>综合分（闪击60% + 狙击40%，起点权重）</small></div>
    <div class="result-cards">
      <div class="rcard">
        <div class="rcard-name">⚡ 闪击</div>
        <div class="rcard-big"><span id="res-flash-ms">—</span><small>ms 中位数</small></div>
        <div class="rcard-detail" id="res-flash-detail"></div>
      </div>
      <div class="rcard">
        <div class="rcard-name">🎯 狙击</div>
        <div class="rcard-big"><span id="res-sniper-score">—</span><small>复合分</small></div>
        <div class="rcard-detail" id="res-sniper-detail"></div>
      </div>
    </div>
    <p class="diagnosis" id="res-diagnosis"></p>
    <p class="device-note" id="res-device"></p>
    <div class="result-btns">
      <button id="btn-again" class="btn-primary">再来一局</button>
      <button id="btn-home" class="btn-ghost">回主页</button>
    </div>
  </section>

</div>
<script>
'use strict';
/* 《反应天梯》M1 原型：闪击 + 狙击
   计分口径见 设计案v0.2.md。纯函数在前，便于 node 对账测试。 */

var SAVE_KEY = 'reflex_ladder_save_v1';
var FLASH_TRIALS = 5;          // M1 原型 5 次验手感，M2 正式切 7 次
var SNIPER_TARGETS = 10;
var SNIPER_TIMEOUT = 1500;     // ms，靶超时计 0 分

function median(arr) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function mean(arr) {
  if (!arr.length) return 0;
  return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
}
function stddev(arr) {
  if (arr.length < 2) return 0;
  var mu = mean(arr), v = 0;
  arr.forEach(function (x) { v += (x - mu) * (x - mu); });
  return Math.sqrt(v / arr.length);
}
/* 闪击汇总：CV>0.25 时剔除最快一试再取中位数（防预判混入，处置定版） */
function summarizeFlash(rts) {
  var used = rts.slice(), dropped = null, cv = 0;
  if (rts.length >= 3) {
    cv = mean(rts) ? stddev(rts) / mean(rts) : 0;
    if (cv > 0.25) {
      dropped = Math.min.apply(null, used);
      used.splice(used.indexOf(dropped), 1);
    }
  }
  return { median: Math.round(median(used)), used: used, dropped: dropped, cv: cv };
}
/* 闪击分（0-1000）：锚点分段线性，起点值未冻结。213ms→760（普通人校正均值附近） */
var FLASH_ANCHORS = [[140, 1000], [180, 880], [213, 760], [250, 620], [300, 420], [350, 250], [450, 80], [600, 30]];
function flashScoreFromMs(ms) {
  if (ms <= FLASH_ANCHORS[0][0]) return 1000;
  for (var i = 1; i < FLASH_ANCHORS.length; i++) {
    if (ms <= FLASH_ANCHORS[i][0]) {
      var a = FLASH_ANCHORS[i - 1], b = FLASH_ANCHORS[i];
      return Math.round(a[1] + (b[1] - a[1]) * (ms - a[0]) / (b[0] - a[0]));
    }
  }
  return 30;
}
/* 狙击复合分 = 1000 × 命中率 × (0.55 + 0.45×速度系数)，速度系数由命中中位 rt 决定（处置定版：不用原始 ms 同轴） */
function sniperComposite(hits, total, hitRts) {
  if (!total || !hits) return { score: 0, hitRate: 0, medianRt: 0, speedNorm: 0 };
  var hitRate = hits / total;
  var medRt = median(hitRts);
  var speedNorm = Math.max(0, Math.min(1, (1100 - medRt) / 800));
  var score = Math.round(1000 * hitRate * (0.55 + 0.45 * speedNorm));
  return { score: score, hitRate: hitRate, medianRt: Math.round(medRt), speedNorm: speedNorm };
}
/* 单靶展示分（仅结算明细用）：速度 60% + 落点精度 40% */
function sniperTargetPoints(rt, distRatio) {
  var speed = Math.max(0, Math.min(1, (1100 - rt) / 950));
  return Math.round(1000 * (0.6 * speed + 0.4 * (1 - distRatio)));
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { median: median, mean: mean, stddev: stddev, summarizeFlash: summarizeFlash, flashScoreFromMs: flashScoreFromMs, sniperComposite: sniperComposite, sniperTargetPoints: sniperTargetPoints };
}

/* ================= 游戏逻辑（浏览器） ================= */
if (typeof document !== 'undefined') (function () {
  var $ = function (id) { return document.getElementById(id); };
  var screens = { home: $('screen-home'), flash: $('screen-flash'), sniper: $('screen-sniper'), result: $('screen-result') };
  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].classList.toggle('active', k === name); });
    window.scrollTo(0, 0);
  }

  /* ---------- 音效 / 震动 ---------- */
  var AC = null;
  function beep(freq, dur, type) {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.12, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
    } catch (e) {}
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  /* ---------- 存档 ---------- */
  function loadSave() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; }
  }
  function storeSave(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} }

  /* ---------- 设备档检测（rAF 帧间隔中位数粗分，阈值候选未冻结） ---------- */
  var device = { bucket: '检测中', frameMs: 0, input: '触屏' };
  (function detectDevice() {
    var stamps = [], last = 0, frames = 0;
    function tick(t) {
      if (last) stamps.push(t - last);
      last = t; frames++;
      if (frames < 70) requestAnimationFrame(tick);
      else {
        var fm = median(stamps.slice(5));
        device.frameMs = Math.round(fm * 10) / 10;
        device.bucket = fm <= 9.5 ? '高刷档' : (fm >= 13.5 ? '标准档' : '均衡档（阈值待定）');
        renderDeviceLine();
      }
    }
    requestAnimationFrame(tick);
  })();
  function renderDeviceLine() {
    $('device-line').textContent = '设备档：' + device.input + ' · ' + device.bucket + '（帧间隔约 ' + device.frameMs + 'ms）';
    var s = loadSave(), best = [];
    if (s.bestFlashMs) best.push('闪击最佳 ' + s.bestFlashMs + 'ms');
    if (s.bestSniperScore) best.push('狙击最佳 ' + s.bestSniperScore + ' 分');
    if (s.bestCombo) best.push('综合最佳 ' + s.bestCombo + ' 分');
    $('home-best').textContent = best.length ? ('🏆 ' + best.join('　·　') + (s.plays ? '　·　共 ' + s.plays + ' 局' : '')) : '暂无纪录，来打出你的第一局';
  }

  /* ---------- 闪击 ---------- */
  var F = null;
  function flashReset() {
    F = { rts: [], fouls: 0, state: 'idle', timer: null, goTime: 0 };
  }
  function flashArm() {
    F.state = 'wait';
    var arena = $('flash-arena');
    arena.className = 'arena flash-wait';
    $('flash-text').textContent = '等待变绿…';
    $('flash-sub').textContent = '变绿后立刻点任意位置，抢跑本轮作废';
    $('flash-progress').textContent = '闪击 ' + F.rts.length + '/' + FLASH_TRIALS;
    $('flash-fouls').textContent = F.fouls ? ('抢跑 ' + F.fouls + ' 次') : '';
    var delay = 1200 + Math.random() * 3300;
    F.timer = setTimeout(function () {
      requestAnimationFrame(function () {
        arena.className = 'arena flash-go';
        $('flash-text').textContent = '点！';
        $('flash-sub').textContent = '';
        F.goTime = performance.now();
        F.state = 'go';
      });
    }, delay);
  }
  function flashPop(txt, color) {
    var p = $('flash-last');
    p.textContent = txt; p.style.color = color || '';
    p.classList.add('show');
    setTimeout(function () { p.classList.remove('show'); }, 650);
  }
  $('flash-arena').addEventListener('pointerdown', function (e) {
    if (!F) return;
    device.input = e.pointerType === 'mouse' ? '鼠标' : '触屏';
    if (F.state === 'idle') { flashArm(); return; }
    if (F.state === 'wait') {
      clearTimeout(F.timer);
      F.fouls++; beep(150, 0.25, 'sawtooth'); buzz(80);
      flashPop('抢跑！', '#ef4444');
      $('flash-text').textContent = '太早了，本轮作废';
      $('flash-sub').textContent = '等变绿再点，重新等这一轮';
      F.state = 'idle-settle';
      setTimeout(flashArm, 900);
      return;
    }
    if (F.state === 'go') {
      var rt = performance.now() - F.goTime;
      F.state = 'idle-settle';
      if (rt < 100) {
        beep(150, 0.25, 'sawtooth');
        flashPop('疑似预判', '#ef4444');
        $('flash-text').textContent = Math.round(rt) + 'ms 快得不真实，本轮不算';
        $('flash-sub').textContent = '低于 100ms 视为预判，重来这一轮';
        setTimeout(flashArm, 1000);
        return;
      }
      F.rts.push(rt);
      beep(rt < 200 ? 980 : 660, 0.12); buzz(25);
      flashPop(Math.round(rt) + 'ms!', rt < 200 ? '#22ff9a' : '');
      $('flash-progress').textContent = '闪击 ' + F.rts.length + '/' + FLASH_TRIALS;
      if (F.rts.length >= FLASH_TRIALS) setTimeout(startSniper, 700);
      else setTimeout(flashArm, 700);
    }
  });

  /* ---------- 狙击 ---------- */
  var S = null;
  function startSniper() {
    show('sniper');
    S = { idx: 0, hits: 0, misses: 0, hitRts: [], points: [], state: 'gap', goTime: 0, timer: null, targetTimer: null, cx: 0, cy: 0, r: 0 };
    sniperNext();
  }
  function sniperNext() {
    if (S.idx >= SNIPER_TARGETS) { finishGame(); return; }
    S.state = 'gap';
    $('sniper-target').hidden = true;
    $('sniper-progress').textContent = '狙击 ' + S.idx + '/' + SNIPER_TARGETS;
    $('sniper-hits').textContent = '命中 ' + S.hits + ' · 空点 ' + S.misses;
    $('sniper-tip').textContent = '第 ' + (S.idx + 1) + ' 个靶…';
    var delay = 400 + Math.random() * 700;
    S.timer = setTimeout(sniperSpawn, delay);
  }
  function sniperSpawn() {
    var arena = $('sniper-arena'), t = $('sniper-target');
    var size = Math.round(76 - (76 - 44) * (S.idx / (SNIPER_TARGETS - 1)));
    var aw = arena.clientWidth, ah = arena.clientHeight;
    var x = 8 + Math.random() * Math.max(10, aw - size - 16);
    var y = 40 + Math.random() * Math.max(10, ah - size - 56);
    t.style.width = size + 'px'; t.style.height = size + 'px';
    t.style.left = x + 'px'; t.style.top = y + 'px';
    S.cx = x + size / 2; S.cy = y + size / 2; S.r = size / 2;
    requestAnimationFrame(function () {
      t.hidden = false;
      S.goTime = performance.now();
      S.state = 'live';
      S.targetTimer = setTimeout(function () {
        if (S.state !== 'live') return;
        S.state = 'gap'; S.points.push(0); S.idx++;
        sniperPop('超时 0', '#ef4444');
        sniperNext();
      }, SNIPER_TIMEOUT);
    });
  }
  function sniperPop(txt, color) {
    var p = $('sniper-pop');
    p.textContent = txt; p.style.color = color || '';
    p.classList.add('show');
    setTimeout(function () { p.classList.remove('show'); }, 550);
  }
  $('sniper-arena').addEventListener('pointerdown', function (e) {
    if (!S || S.state !== 'live') return;
    device.input = e.pointerType === 'mouse' ? '鼠标' : '触屏';
    var rect = $('sniper-arena').getBoundingClientRect();
    var px = e.clientX - rect.left, py = e.clientY - rect.top;
    var dist = Math.hypot(px - S.cx, py - S.cy);
    clearTimeout(S.targetTimer);
    S.state = 'gap';
    $('sniper-target').hidden = true;
    if (dist <= S.r) {
      var rt = performance.now() - S.goTime;
      var pts = sniperTargetPoints(rt, dist / S.r);
      S.hits++; S.hitRts.push(rt); S.points.push(pts);
      beep(920, 0.1); buzz(20);
      sniperPop(Math.round(rt) + 'ms +' + pts, '#22ff9a');
    } else {
      S.misses++; S.points.push(0);
      beep(180, 0.18, 'sawtooth'); buzz(60);
      sniperPop('空点 0', '#ef4444');
    }
    S.idx++;
    setTimeout(sniperNext, 260);
  });

  /* ---------- 结算 ---------- */
  function finishGame() {
    var fs = summarizeFlash(F.rts);
    var fScore = flashScoreFromMs(fs.median);
    var sn = sniperComposite(S.hits, SNIPER_TARGETS, S.hitRts);
    var combo = Math.round(fScore * 0.6 + sn.score * 0.4);
    $('combo-score').textContent = combo;
    $('res-flash-ms').textContent = fs.median;
    $('res-flash-detail').textContent =
      '各次：' + fs.used.map(function (x) { return Math.round(x); }).join(' / ') + 'ms' +
      (fs.dropped !== null ? '；波动过大（CV ' + fs.cv.toFixed(2) + '），已剔除最快一试 ' + Math.round(fs.dropped) + 'ms' : '；稳定性 CV ' + fs.cv.toFixed(2)) +
      (F.fouls ? '；抢跑 ' + F.fouls + ' 次' : '') + '；闪击分 ' + fScore;
    $('res-sniper-score').textContent = sn.score;
    $('res-sniper-detail').textContent =
      '命中 ' + S.hits + '/' + SNIPER_TARGETS + '（命中率 ' + Math.round(sn.hitRate * 100) + '%）' +
      (S.hits ? '；命中中位 ' + sn.medianRt + 'ms' : '') +
      '；空点 ' + S.misses + ' 次（空点计 0 分）';
    var diag;
    if (fs.median <= 220 && sn.hitRate < 0.7) diag = '诊断：手不慢，输在定位——狙击命中率拖了后腿，专练找靶比练反应更划算。';
    else if (fs.median > 280 && sn.hitRate >= 0.8) diag = '诊断：瞄得准但出手慢——纯反应是短板，先把闪击练进 250ms 以内。';
    else if (fs.median <= 200 && sn.hitRate >= 0.8) diag = '诊断：又快又准，这局挑不出明显短板，去冲击你的综合最佳。';
    else if (fs.cv > 0.25) diag = '诊断：状态波动大——偶尔的神仙一手不算数，稳定性才是你现在最该练的。';
    else diag = '诊断：两项都中规中矩，最弱环看单项分：' + (fScore <= sn.score ? '闪击偏弱，先练纯反应。' : '狙击偏弱，先练定位。');
    $('res-diagnosis').textContent = diag;
    $('res-device').textContent = '本局口径：' + device.input + ' · ' + device.bucket + '（帧间隔约 ' + device.frameMs + 'ms）。成绩含设备延迟，换设备不可直接比；本设备测得值只作同设备对比。';
    var s = loadSave();
    s.plays = (s.plays || 0) + 1;
    if (!s.bestFlashMs || fs.median < s.bestFlashMs) s.bestFlashMs = fs.median;
    if (!s.bestSniperScore || sn.score > s.bestSniperScore) s.bestSniperScore = sn.score;
    if (!s.bestCombo || combo > s.bestCombo) s.bestCombo = combo;
    s.lastDevice = device.bucket;
    storeSave(s);
    beep(660, 0.12); setTimeout(function () { beep(880, 0.12); }, 130); setTimeout(function () { beep(1180, 0.2); }, 260);
    show('result');
  }

  /* ---------- 导航 ---------- */
  function startGame() {
    flashReset();
    show('flash');
    $('flash-arena').className = 'arena flash-idle';
    $('flash-text').textContent = '点击开始';
    $('flash-sub').textContent = '变绿后立刻点任意位置，抢跑作废';
    $('flash-progress').textContent = '闪击 0/' + FLASH_TRIALS;
    $('flash-fouls').textContent = '';
  }
  $('btn-start').addEventListener('click', startGame);
  $('btn-again').addEventListener('click', startGame);
  $('btn-home').addEventListener('click', function () { renderDeviceLine(); show('home'); });
  $('btn-flash-quit').addEventListener('click', function () { if (F) clearTimeout(F.timer); renderDeviceLine(); show('home'); });
  $('btn-sniper-quit').addEventListener('click', function () { if (S) { clearTimeout(S.timer); clearTimeout(S.targetTimer); } renderDeviceLine(); show('home'); });
  renderDeviceLine();
})();

</script>
</body>
</html>
